openapi: 3.1.0
info:
  title: SplitEase receipt import API
  version: 1.0.0
  description: Publicly submit normalized receipts for review in the SplitEase shared workspace. No authentication is required.
servers:
  - url: https://pooobzllagsownfpmrpf.supabase.co/functions/v1
paths:
  /receipt-import:
    post:
      operationId: submitReceipt
      summary: Submit one normalized receipt
      description: A caller processes the source receipt and submits JSON without authentication. A successful submission enters the pending inbox; it does not modify a split until accepted. All callers share a 60 requests per minute limit.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Stable, unique key for this submission. Reuse it only when retrying the identical body. All public callers share a receipt-ID namespace.
          schema:
            type: string
            minLength: 8
            maxLength: 128
            pattern: '^[A-Za-z0-9._:-]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Receipt'
            examples:
              groceryDelivery:
                summary: Charged, refunded, and unavailable items
                value:
                  schema_version: 1
                  external_receipt_id: order-2026-10-09-1842
                  receipt_type: grocery_delivery
                  merchant: Example Market
                  purchased_on: '2026-10-09'
                  currency: USD
                  items:
                    - external_item_id: milk
                      name: Whole milk
                      quantity: 1
                      line_total_cents: 499
                      state: charged
                    - external_item_id: bread
                      name: Sourdough bread
                      quantity: 1
                      line_total_cents: 650
                      state: refunded
                    - external_item_id: eggs
                      name: Eggs, unavailable
                      quantity: 1
                      line_total_cents: 399
                      state: not_charged
                  subtotal_cents: 1149
                  discount_cents: 100
                  tax_cents: 0
                  tip_cents: 200
                  delivery_cents: 299
                  order_refund_cents: 0
                  total_cents: 898
      responses:
        '201':
          description: New receipt accepted into the pending inbox
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '200':
          description: Identical retry; returns the existing import ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '400':
          $ref: '#/components/responses/Error'
        '405':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
components:
  schemas:
    Receipt:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - external_receipt_id
        - receipt_type
        - merchant
        - purchased_on
        - currency
        - items
        - subtotal_cents
        - discount_cents
        - tax_cents
        - tip_cents
        - delivery_cents
        - order_refund_cents
        - total_cents
      properties:
        schema_version:
          type: integer
          const: 1
        external_receipt_id:
          type: string
          minLength: 1
          maxLength: 128
          description: Stable ID supplied by the caller. Unique across public submissions.
        receipt_type:
          type: string
          enum: [grocery, grocery_delivery, restaurant, retail, other]
        merchant:
          type: string
          minLength: 1
          maxLength: 120
        purchased_on:
          type: string
          format: date
        currency:
          type: string
          const: USD
        items:
          type: array
          minItems: 1
          maxItems: 300
          items:
            $ref: '#/components/schemas/Item'
          description: external_item_id values must be unique within the receipt.
        subtotal_cents:
          $ref: '#/components/schemas/Cents'
        discount_cents:
          $ref: '#/components/schemas/Cents'
        tax_cents:
          $ref: '#/components/schemas/Cents'
        tip_cents:
          $ref: '#/components/schemas/Cents'
        delivery_cents:
          $ref: '#/components/schemas/Cents'
        order_refund_cents:
          $ref: '#/components/schemas/Cents'
        total_cents:
          $ref: '#/components/schemas/Cents'
    Item:
      type: object
      additionalProperties: false
      required: [external_item_id, name, quantity, line_total_cents, state]
      properties:
        external_item_id:
          type: string
          minLength: 1
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 200
        quantity:
          type: number
          exclusiveMinimum: 0
          maximum: 1000000
          multipleOf: 0.001
        line_total_cents:
          $ref: '#/components/schemas/Cents'
        state:
          type: string
          enum: [charged, refunded, not_charged]
    Cents:
      type: integer
      minimum: 0
      maximum: 9007199254740991
    Submission:
      type: object
      additionalProperties: false
      required: [import_id, status, duplicate]
      properties:
        import_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, imported, rejected]
        duplicate:
          type: boolean
    ErrorBody:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            path:
              type: string
              description: JSON path of the invalid value, when applicable.
  responses:
    Error:
      description: Request rejected
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
